# JUnit Platform Configuration for ExcaliburDB Integration Tests
#
# This configuration ensures that test failures are automatically categorized
# and reported with actionable error messages and remediation guidance.
#
# Domain Correctness:
# - Failures are categorized by severity (CRITICAL, MAJOR, MINOR)
# - Each failure includes domain context and remediation steps
# - Reports help developers quickly identify root causes

# Enable automatic extension detection for FailureReportingExtension
junit.jupiter.extensions.autodetection.enabled=true

# Enable parallel test execution for faster integration test runs
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=concurrent
junit.jupiter.execution.parallel.mode.classes.default=concurrent

# Configure parallel execution for integration tests
# Use a conservative configuration to avoid resource contention
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=4

# Enable test method ordering for deterministic test execution
junit.jupiter.testmethod.order.default=org.junit.jupiter.api.MethodOrderer$OrderAnnotation

# Enable display name generation for clearer test output
junit.jupiter.displayname.generator.default=org.junit.jupiter.api.DisplayNameGenerator$Standard

# Timeout configuration to prevent hanging tests
junit.jupiter.execution.default.timeout.mode=enabled
junit.jupiter.execution.default.timeout.duration=5
junit.jupiter.execution.default.timeout.unit=minutes
