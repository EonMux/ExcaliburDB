# ExcaliburDB Configuration File
# Edit this file to customize runtime behavior
#
# Environment variable overrides take precedence:
#   export EXCALIBUR_VISIBILITY_EPOCH_TICK_MS=500
#
# Config is loaded at startup and cached. For changes, restart the application.

# Visibility Configuration
# Queries started at the same epoch see a consistent snapshot of the index
# Default: 100ms epoch tick
excalibur.visibility.epoch-tick-ms=100

# Query Configuration
# Include results from segments that are still being indexed
# Default: true
excalibur.query.include-partial-segments=true
# Default top-k value for queries
excalibur.query.default-top-k=10
# Default relevancy threshold (0.0 to 1.0)
excalibur.query.default-threshold=0.3

# Ingestion Configuration
# Maximum depth of HNSW integration queue (backpressure threshold)
# Default: 100000
excalibur.ingest.hnsw-queue-depth-limit=100000
# Enable document-atomic visibility (documents appear fully indexed)
# Default: true
excalibur.ingest.document-atomicity=true

# Health Monitoring Configuration
# Minimum corpus coverage required to report "ready" status
# Default: 50%
excalibur.health.readiness-threshold=0.5
# Enable this endpoint
excalibur.enabled=true
