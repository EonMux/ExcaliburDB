# ExcaliburDB Configuration
# This file demonstrates default configuration values.
# Environment variables with EXCALIBUR_ prefix can override these values.

# Application
excalibur.enabled=true

# Visibility Configuration
excalibur.visibility.epoch-tick-ms=100
excalibur.visibility.query-timeout-ms=30000

# Ingest Configuration
excalibur.ingest.hnsw-queue-depth-limit=100000
excalibur.ingest.document-atomicity-timeout-ms=2000

# Health Configuration
excalibur.health.readiness-threshold=0.5
excalibur.health.healthy-threshold=0.9
excalibur.health.max-latency-ms=5000

# Query Configuration
excalibur.query.top-k-default=100
excalibur.query.recall-target=0.95
excalibur.query.include-partial-segments=true
excalibur.query.vector-dimensions=1536
excalibur.query.llm-timeout-ms=60000
excalibur.query.llm-retry-max=3
excalibur.query.llm-retry-backoff-base-ms=1000
excalibur.query.llm-retry-backoff-max-ms=30000
excalibur.query.llm-retry-initial-jitter-ms=100
excalibur.query.llm-retry-max-jitter-ms=500

# LLM Configuration
excalibur.llm.base-url=https://api.openai.com/v1
excalibur.llm.api-key=
excalibur.llm.model=text-embedding-ada-002
excalibur.llm.embeddings-dimensions=1536
excalibur.llm.timeout-ms=60000
excalibur.llm-retry-max=3
excalibur.llm-retry-backoff-base-ms=1000
excalibur.llm-retry-backoff-max-ms=30000
excalibur.llm-retry-initial-jitter-ms=100
excalibur.llm-retry-max-jitter-ms=500

# Shard Configuration
excalibur.shard.segment-load-factor=0.7
excalibur.shard.default-ef-construction=128
excalibur.shard.default-ef-search=64
excalibur.shard.compaction-delay-ms=10000
excalibur.shard.segment-recovery-enabled=true
excalibur.shard.segment-recovery-ttl-seconds=3600
excalibur.shard.segment-recovery-ttl-refresh-interval-ms=60000
excalibur.shard.segment-recovery-cleanup-enabled=true
excalibur.shard.segment-recovery-cleanup-interval-ms=300000
excalibur.shard.segment-recovery-max-concurrent=4
excalibur.shard.segment-recovery-worker-priority=LOW
excalibur.shard.segment-recovery-stale-threshold=0.01
excalibur.shard.segment-recovery-visibility-epoch-lag-tolerance-ms=1000
excalibur.shard.segment-recovery-segment-size-limit=1073741824
excalibur.shard.segment-recovery-visibility-epoch-visibility-ms=1000
excalibur.shard.segment-recovery-visibility-epoch-ttl-seconds=300
excalibur.shard.segment-recovery-visibility-epoch-ttl-refresh-interval-ms=60000
excalibur.shard.segment-recovery-visibility-epoch-cleanup-enabled=true
excalibur.shard.segment-recovery-visibility-epoch-cleanup-interval-ms=600000
excalibur.shard.segment-recovery-visibility-epoch-max-age-seconds=86400
excalibur.shard.segment-recovery-visibility-epoch-epoch-visibility-ms=1000
excalibur.shard.segment-recovery-visibility-epoch-epoch-ttl-seconds=300
excalibur.shard.segment-recovery-visibility-epoch-epoch-ttl-refresh-interval-ms=60000
excalibur.shard.segment-recovery-visibility-epoch-epoch-cleanup-enabled=true
excalibur.shard.segment-recovery-visibility-epoch-epoch-cleanup-interval-ms=600000
excalibur.shard.segment-recovery-visibility-epoch-epoch-max-age-seconds=86400
excalibur.shard.segment-recovery-visibility-epoch-epoch-epoch-visibility-ms=1000
excalibur.shard.segment-recovery-visibility-epoch-epoch-epoch-ttl-seconds=300
excalibur.shard.segment-recovery-visibility-epoch-epoch-epoch-ttl-refresh-interval-ms=60000
excalibur.shard.segment-recovery-visibility-epoch-epoch-epoch-cleanup-enabled=true
excalibur.shard.segment-recovery-visibility-epoch-epoch-epoch-cleanup-interval-ms=600000
excalibur.shard.segment-recovery-visibility-epoch-epoch-epoch-max-age-seconds=86400
excalibur.shard.segment-recovery-visibility-epoch-epoch-epoch-epoch-visibility-ms=1000
excalibur.shard.segment-recovery-visibility-epoch-epoch-epoch-epoch-ttl-seconds=300
excalibur.shard.segment-recovery-visibility-epoch-epoch-epoch-epoch-ttl-refresh-interval-ms=60000
excalibur.shard.segment-recovery-visibility-epoch-epoch-epoch-epoch-cleanup-enabled=true
excalibur.shard.segment-recovery-visibility-epoch-epoch-epoch-epoch-cleanup-interval-ms=600000
excalibur.shard.segment-recovery-visibility-epoch-epoch-epoch-epoch-max-age-seconds=86400
