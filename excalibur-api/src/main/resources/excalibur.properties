# ExcaliburDB Default Configuration
# Disk-backed data relevancy retrieval engine for LLMs
#
# This file provides default configuration values for the ExcaliburDB server.
# Configuration values can be overridden by:
#   1. Environment variables (e.g., EXCALIBUR_VISIBILITY_EPOCH_TICK_MS=200)
#   2. A custom properties file specified via --config flag
#
# Usage:
#   java --enable-preview --enable-native-access=ALL-UNNAMED -jar excalibur.jar --config excalibur.properties

# ============================================
# Visibility Configuration
# ============================================
# Epoch tick interval in milliseconds - controls visibility epoch advancement
excalibur.visibility.epoch-tick-ms=100

# Query timeout in milliseconds
excalibur.visibility.query-timeout-ms=30000

# ============================================
# Ingest Configuration
# ============================================
# HNSW integration queue depth limit - backpressure threshold

# Document atomicity timeout - max wait for HNSW backpressure
excalibur.ingest.document-atomicity-timeout-ms=2000

# Enable document atomicity - ensures queries never see partial documents
excalibur.ingest.document-atomicity=true

# ============================================
# Health Configuration
# ============================================
# Readiness threshold - coverage below this value means not ready
excalibur.health.readiness-threshold=0.5

# Healthy threshold - coverage above this value means healthy
excalibur.health.healthy-threshold=0.9

# Maximum query latency in milliseconds for health check
excalibur.health.max-latency-ms=5000

# ============================================
# Query Configuration
# ============================================
# Default number of results to return
excalibur.query.top-k-default=100

# Target recall for approximate nearest neighbor search
excalibur.query.recall-target=0.95

# Minimum relevancy score threshold
excalibur.query.threshold=0.3

# Vector dimensions for embeddings
excalibur.query.vector-dimensions=1536

# LLM timeout for query relevancy scoring
excalibur.query.llm-timeout-ms=60000

# Include segments still being indexed in queries
excalibur.query.include-partial-segments=true

# ============================================
# LLM Configuration
# ============================================
# Base URL for OpenAI-compatible API
excalibur.llm.base-url=https://api.openai.com/v1

# API key (override via environment variable EXCALIBUR_LLM_API_KEY)
excalibur.llm.api-key=

# Chat model for relevancy scoring
excalibur.llm.chat-model=gpt-4o-mini

# Embedding model for vector generation
excalibur.llm.embedding-model=text-embedding-3-small

# Embedding vector dimensions
excalibur.llm.embeddings-dimensions=1536

# HTTP request timeout in milliseconds
excalibur.llm.timeout-ms=60000

# Maximum retry attempts
excalibur.llm.max-retries=3

# Circuit breaker failure threshold
excalibur.llm.failure-threshold=5

# Circuit breaker cooldown period in milliseconds
excalibur.llm.cooldown-period-ms=60000

# Maximum prompts per query for relevancy scoring
excalibur.llm.max-prompts-per-query=10

# Minimum relevancy score (0.0 - 1.0)
excalibur.llm.relevancy-threshold=0.3

# Maximum tokens per batch for relevancy scoring
excalibur.llm.max-batch-tokens=4000

# ============================================
# Shard Configuration
# ============================================
# Segment load factor for splitting (0.0, 1.0]
excalibur.shard.segment-load-factor=0.7

# HNSW construction candidate list size
excalibur.shard.default-ef-construction=128

# HNSW search candidate list size
excalibur.shard.default-ef-search=64

# Compaction delay in milliseconds
excalibur.shard.compaction-delay-ms=10000

# HNSW integration queue depth limit
excalibur.shard.hnsw-integration-queue-depth-limit=100000
