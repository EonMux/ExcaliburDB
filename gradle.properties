# Gradle properties for ExcaliburDB
# Optimized for build time < 5 minutes

# JVM settings - optimized for parallel compilation
org.gradle.jvmargs=-Xmx6g -Xms1g -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseStringDeduplication

# Build performance settings
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.workers.max=8

# File system watching for faster incremental builds (Gradle 6.5+)
org.gradle.vfs.watch=true

# Daemon settings - keep daemon alive for faster builds
org.gradle.daemon=true
org.gradle.daemon.idletimeout=7200000

# Build cache configuration
org.gradle.caching.directory=.gradle/caches/build-cache-1

# Console output
org.gradle.console=auto

# Kotlin
kotlin.code.style=official

# Test parallel execution
systemProp.junit.jupiter.execution.parallel.enabled=true
systemProp.junit.jupiter.execution.parallel.mode.default=concurrent
systemProp.junit.jupiter.execution.parallel.mode.classes.default=concurrent
systemProp.junit.jupiter.execution.parallel.config.strategy=fixed
systemProp.junit.jupiter.execution.parallel.config.fixed.parallelism=4
