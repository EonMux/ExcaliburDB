# Gradle properties for ExcaliburDB Phase 1

# Java version
org.gradle.java.home=/usr/lib/jvm/java-21-openjdk
org.gradle.jvmargs=-Xmx4g -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -Dfile.encoding=UTF-8

# Project settings
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# Gradle version
org.gradle.java.installations.auto-download=true
org.gradle.java.installations.default=jdk-21

# SonarQube
sonar.projectKey=excaliburdb
sonar.organization=anomalyco
sonar.host.url=https://sonarcloud.io
sonar.sources=src/main/java
sonar.excludes=**/generated/**,**/test/**
sonar.coverage.jacoco.reportPath=build/reports/jacoco/test/jacocoTestReport.exec

# AndroidX
android.useAndroidX=true
android.enableJetifier=true

# Kotlin
kotlin.code.style=official
